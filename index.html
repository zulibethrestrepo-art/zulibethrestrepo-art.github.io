<style>
  :root{
    color-scheme: light;
    --lavanda:#ece7f6;
    --lavanda-2:#e2daf0;
    --morado:#2a1d3f;
    --morado-card:#3a2a55;
    --lila:#c8a8e0;
    --lila-2:#8a6ec0;
    --tinta:#332a22;
    --mute:#5f544a;
    --mute-2:#8a7c6a;
    --terra:#c26a44;
    --crema:#f5ede1;
    --blanco:#fffdf9;
    --texto-oscuro:#f3edfa;
    --texto-oscuro-2:#c3b6d9;
    --linea:rgba(51,42,34,.12);
    --sombra:0 1px 2px rgba(42,29,63,.06);
    --sombra-alta:0 10px 24px rgba(42,29,63,.12);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:radial-gradient(90% 32% at 50% 0%, var(--lavanda-2), transparent 100%), var(--lavanda);
    color:var(--tinta);
    font-family:'Jost',system-ui,-apple-system,sans-serif;
    font-weight:400;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-inline:20px;
    padding-block:0 3.5rem;
    min-height:100vh;
  }
  a{color:inherit}
  a:focus-visible,button:focus-visible{outline:2px solid var(--terra);outline-offset:3px}
  img{max-width:100%;display:block}
  svg{display:block}

  .pagina{max-width:560px;margin:0 auto;padding-top:1rem}

  /* ---------- cabecera ---------- */
  .cabecera{
    position:relative;
    display:flex;flex-direction:column;align-items:center;
    text-align:center;
    padding-top:3.2rem;
  }
  .compartir{
    position:absolute;right:0;top:.6rem;
    width:42px;height:42px;border-radius:50%;
    border:1px solid var(--linea);
    background:rgba(255,253,249,.6);
    color:var(--tinta);
    display:grid;place-items:center;
    cursor:pointer;padding:0;
    transition:background .18s ease,color .18s ease;
  }
  .compartir:hover{background:var(--tinta);color:var(--crema)}
  .compartir svg{width:18px;height:18px}

  .avatar{
    width:118px;height:118px;border-radius:50%;object-fit:cover;
    box-shadow:0 0 0 4px var(--lavanda),0 0 0 6px var(--lila),0 14px 30px rgba(42,29,63,.16);
  }
  .nombre{
    font-family:'Instrument Serif',Georgia,serif;
    font-weight:400;
    font-size:2.25rem;line-height:1.05;letter-spacing:-.01em;
    margin:1.1rem 0 0;
    text-wrap:balance;
  }
  .descripcion{margin:.35rem 0 0;color:var(--mute);font-size:1rem}
  .nichos{
    margin:.55rem 0 0;
    font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--lila-2);font-weight:500;
  }
  .redes{display:flex;flex-wrap:wrap;justify-content:center;gap:.55rem;margin:1rem 0 0;list-style:none;padding:0}
  .redes a{
    width:44px;height:44px;border-radius:50%;
    display:grid;place-items:center;
    color:var(--tinta);
    border:1px solid var(--linea);
    background:rgba(255,253,249,.6);
    transition:background .18s ease,color .18s ease,transform .18s ease;
  }
  .redes a:hover{background:var(--tinta);color:var(--crema);transform:translateY(-1px)}
  .redes svg{width:20px;height:20px}

  /* ---------- seguidores ---------- */
  .cifras{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;
    margin-top:1.7rem;
  }
  .cifra{
    display:flex;flex-direction:column;align-items:center;gap:1px;
    padding:15px 12px 13px;
    border-radius:40px;
    background:var(--morado);color:var(--texto-oscuro);
    text-decoration:none;
    box-shadow:var(--sombra);
    transition:background .18s ease,transform .18s ease,box-shadow .18s ease;
  }
  .cifra:hover{background:var(--morado-card);transform:translateY(-1px);box-shadow:var(--sombra-alta)}
  .cifra svg{width:20px;height:20px;margin-bottom:5px}
  .cifra__num{
    font-family:'Instrument Serif',Georgia,serif;
    font-size:1.75rem;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .cifra__lab{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--texto-oscuro-2);margin-top:4px}

  /* ---------- lista de enlaces ---------- */
  .lista{display:flex;flex-direction:column;gap:12px;margin-top:1.5rem}
  .tarjeta{
    display:flex;align-items:center;gap:14px;
    width:100%;
    padding:13px 16px 13px 13px;
    border-radius:40px;
    background:var(--crema);
    border:1px solid rgba(51,42,34,.08);
    color:var(--tinta);
    text-decoration:none;
    font:inherit;text-align:left;
    cursor:pointer;
    box-shadow:var(--sombra);
    transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
  }
  .tarjeta:hover{transform:translateY(-1px);box-shadow:var(--sombra-alta);background:var(--blanco)}
  .tarjeta:active{transform:translateY(0) scale(.992)}
  .tarjeta__icono{
    flex:none;width:46px;height:46px;border-radius:50%;
    display:grid;place-items:center;
    background:var(--blanco);
    color:var(--terra);
    font-size:1.35rem;line-height:1;
    overflow:hidden;
    border:1px solid rgba(51,42,34,.06);
  }
  .tarjeta__icono svg{width:22px;height:22px}
  .tarjeta__icono img{width:100%;height:100%;object-fit:cover}
  .tarjeta__texto{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .tarjeta__titulo{
    font-family:'Instrument Serif',Georgia,serif;
    font-size:1.32rem;line-height:1.12;
    overflow-wrap:anywhere;
  }
  .tarjeta__sub{font-size:.84rem;color:var(--mute);line-height:1.35;overflow-wrap:anywhere}
  .tarjeta__flecha{
    flex:none;width:30px;height:30px;
    display:grid;place-items:center;
    color:var(--mute-2);
    transition:transform .32s ease,color .18s ease;
  }
  .tarjeta__flecha svg{width:18px;height:18px}
  .tarjeta:hover .tarjeta__flecha{color:var(--terra)}

  /* desplegable */
  .grupo.abierto > .tarjeta{background:var(--blanco);border-color:var(--lila)}
  .grupo.abierto > .tarjeta .tarjeta__flecha{transform:rotate(180deg);color:var(--terra)}
  .grupo__panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .36s ease}
  .grupo.abierto .grupo__panel{grid-template-rows:1fr}
  .grupo__interior{overflow:hidden;min-height:0}
  .grupo__lista{
    display:flex;flex-direction:column;gap:8px;
    padding:10px 8px 2px;
  }
  .subtarjeta{
    display:flex;align-items:center;gap:12px;
    width:100%;
    padding:10px 14px 10px 10px;
    border-radius:40px;
    background:rgba(255,253,249,.7);
    border:1px solid var(--linea);
    color:var(--tinta);
    text-decoration:none;
    font:inherit;text-align:left;cursor:pointer;
    transition:background .18s ease,border-color .18s ease,transform .18s ease;
  }
  .subtarjeta:hover{background:var(--blanco);border-color:var(--lila);transform:translateX(2px)}
  .subtarjeta .tarjeta__icono{width:38px;height:38px;font-size:1.1rem;background:var(--crema)}
  .subtarjeta .tarjeta__icono svg{width:18px;height:18px}
  .subtarjeta .tarjeta__titulo{font-size:1.15rem}
  .subtarjeta .tarjeta__sub{font-size:.8rem}
  .subtarjeta .tarjeta__flecha{width:26px;height:26px}

  /* código de descuento */
  .codigo{
    flex:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.78rem;letter-spacing:.1em;
    padding:7px 11px;border-radius:10px;
    background:var(--morado);color:var(--texto-oscuro);
    display:inline-flex;align-items:center;gap:6px;
    transition:background .18s ease;
  }
  .codigo svg{width:13px;height:13px}
  .copiado .codigo{background:var(--terra)}
  .tarjeta__extra{
    display:inline-block;
    margin:-2px auto 0;
    font-size:.8rem;color:var(--mute);
    text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--lila);
  }
  .tarjeta__extra:hover{color:var(--terra)}
  .bloque{display:flex;flex-direction:column;gap:6px;text-align:center}

  /* ---------- pie ---------- */
  .pie{
    margin-top:2.6rem;text-align:center;
    font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--mute-2);
  }

  /* ---------- aviso "copiado" ---------- */
  .toast{
    position:fixed;left:50%;bottom:26px;
    transform:translate(-50%,10px);
    background:var(--tinta);color:var(--crema);
    padding:10px 18px;border-radius:40px;
    font-size:.9rem;
    opacity:0;pointer-events:none;
    box-shadow:var(--sombra-alta);
    transition:opacity .25s ease,transform .25s ease;
    max-width:calc(100vw - 40px);
  }
  .toast.visible{opacity:1;transform:translate(-50%,0)}

  @media (max-width:400px){
    .nombre{font-size:2rem}
    .tarjeta__titulo{font-size:1.22rem}
    .nichos{font-size:.66rem;letter-spacing:.12em}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>

    salir:      S('<path d="M7 17L17 7"/><path d="M9 7h8v8"/>'),
    abajo:      S('<path d="M6 9.5l6 6 6-6"/>'),
    copiar:     S('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5.5A1.5 1.5 0 0 1 6.5 4H15"/>'),
    listo:      S('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
    punto:      S('<circle cx="12" cy="12" r="3.5"/>', true)
  };

  var esc = function(t){
    return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  };
  var icono = function(nombre, porDefecto){
    if(!nombre) return ICONOS[porDefecto] || '';
    if(ICONOS[nombre]) return ICONOS[nombre];
    if(/\.(png|jpe?g|webp|svg|gif)(\?.*)?$/i.test(nombre) || /^https?:\/\//i.test(nombre)) return '<img src="' + esc(nombre) + '" alt="">';
    return '<span class="emoji">' + esc(nombre) + '</span>';
  };
  var texto = function(item){
    return '<span class="tarjeta__texto"><span class="tarjeta__titulo">' + esc(item.titulo) + '</span>' +
      (item.texto ? '<span class="tarjeta__sub">' + esc(item.texto) + '</span>' : '') + '</span>';
  };

  /* ---------- perfil ---------- */
  var av = document.getElementById('avatar');
  av.src = PERFIL.foto; av.alt = PERFIL.nombre;
  document.getElementById('nombre').textContent = PERFIL.nombre;
  document.getElementById('descripcion').textContent = PERFIL.descripcion || '';
  document.getElementById('nichos').textContent = PERFIL.nichos || '';
  document.getElementById('btn-compartir').innerHTML = ICONOS.compartir;
  document.getElementById('pie').textContent = '© ' + new Date().getFullYear() + ' ' + PERFIL.nombre;

  var etiquetas = {instagram:'Instagram', tiktok:'TikTok', youtube:'YouTube', facebook:'Facebook', whatsapp:'WhatsApp', correo:'Correo'};
  var redes = '';
  Object.keys(PERFIL.redes || {}).forEach(function(red){
    var url = PERFIL.redes[red]; if(!url) return;
    var externo = /^https?:/i.test(url);
    redes += '<li><a href="' + esc(url) + '"' + (externo ? ' target="_blank" rel="noopener"' : '') +
      ' aria-label="' + esc(etiquetas[red] || red) + '" title="' + esc(etiquetas[red] || red) + '">' + icono(red, 'enlace') + '</a></li>';
  });
  document.getElementById('redes').innerHTML = redes;

  var cifras = '';
  (PERFIL.seguidores || []).forEach(function(c){
    cifras += '<a class="cifra" data-red="' + esc(c.red) + '" href="' + esc(c.url) + '" target="_blank" rel="noopener" aria-label="' + esc(c.cantidad) + ' seguidores en ' + esc(etiquetas[c.red] || c.red) + '">' +
      icono(c.red, 'enlace') + '<span class="cifra__num">' + esc(c.cantidad) + '</span><span class="cifra__lab">seguidores</span></a>';
  });
  var secCifras = document.getElementById('cifras');
  secCifras.innerHTML = cifras;
  if(!cifras) secCifras.hidden = true;

  /* Cifras al día: seguidores.json lo actualiza el robot de GitHub cada mañana.
     Si el archivo no está (o falla la red), se quedan los valores de PERFIL. */
  var formatear = function(n){
    try{ return new Intl.NumberFormat('es-CO').format(n); }catch(e){ return String(n); }
  };
  if(cifras && window.fetch){
    fetch('seguidores.json', {cache:'no-store'}).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
      if(!d) return;
      var fecha = '';
      if(d.actualizado){
        try{ fecha = new Date(d.actualizado).toLocaleDateString('es-CO', {day:'numeric', month:'long', year:'numeric'}); }catch(e){}
      }
      secCifras.querySelectorAll('.cifra').forEach(function(el){
        var red = el.getAttribute('data-red');
        if(typeof d[red] !== 'number') return;
        el.querySelector('.cifra__num').textContent = formatear(d[red]);
        el.setAttribute('aria-label', formatear(d[red]) + ' seguidores en ' + (etiquetas[red] || red));
        if(fecha) el.title = 'Actualizado el ' + fecha;
      });
    }).catch(function(){});
  }

  /* ---------- enlaces ---------- */
  var enlace = function(item, clase){
    return '<a class="' + clase + '" href="' + esc(item.url) + '" target="_blank" rel="noopener">' +
      '<span class="tarjeta__icono">' + icono(item.icono, clase === 'subtarjeta' ? 'punto' : 'enlace') + '</span>' + texto(item) +
      '<span class="tarjeta__flecha">' + ICONOS.salir + '</span></a>';
  };
  var codigo = function(item, clase){
    var html = '<button class="' + clase + '" type="button" data-codigo="' + esc(item.codigo) + '" aria-label="Copiar el código ' + esc(item.codigo) + '">' +
      '<span class="tarjeta__icono">' + icono(item.icono, 'etiqueta') + '</span>' + texto(item) +
      '<span class="codigo"><span class="codigo__txt">' + esc(item.codigo) + '</span>' + ICONOS.copiar + '</span></button>';
    if(item.url) html = '<div class="bloque">' + html + '<a class="tarjeta__extra" href="' + esc(item.url) + '" target="_blank" rel="noopener">Ir a la tienda ↗</a></div>';
    return html;
  };
  var n = 0;
  var grupo = function(item){
    var id = 'grupo-' + (++n);
    var dentro = (item.desplegable || []).map(function(sub){
      return sub.codigo ? codigo(sub, 'subtarjeta') : enlace(sub, 'subtarjeta');
    }).join('');
    return '<div class="grupo">' +
      '<button class="tarjeta" type="button" aria-expanded="false" aria-controls="' + id + '">' +
        '<span class="tarjeta__icono">' + icono(item.icono, 'estrella') + '</span>' + texto(item) +
        '<span class="tarjeta__flecha">' + ICONOS.abajo + '</span></button>' +
      '<div class="grupo__panel" id="' + id + '"><div class="grupo__interior"><div class="grupo__lista">' + dentro + '</div></div></div>' +
    '</div>';
  };
  document.getElementById('lista').innerHTML = LINKS.map(function(item){
    if(item.desplegable) return grupo(item);
    if(item.codigo) return codigo(item, 'tarjeta');
    return enlace(item, 'tarjeta');
  }).join('');

  /* ---------- interacción ---------- */
  var toastEl = document.getElementById('toast'), toastTimer;
  var toast = function(msg){
    toastEl.textContent = msg; toastEl.classList.add('visible');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toastEl.classList.remove('visible'); }, 1800);
  };
  var copiar = function(t){
    if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
    return new Promise(function(res){
      var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta); res();
    });
  };

  document.getElementById('lista').addEventListener('click', function(ev){
    var btn = ev.target.closest('button[aria-expanded]');
    if(btn){
      var g = btn.parentNode, abierto = g.classList.toggle('abierto');
      btn.setAttribute('aria-expanded', abierto ? 'true' : 'false');
      return;
    }
    var cod = ev.target.closest('button[data-codigo]');
    if(cod){
      var c = cod.getAttribute('data-codigo');
      copiar(c).then(function(){
        cod.classList.add('copiado');
        var ic = cod.querySelector('.codigo svg'); if(ic) ic.outerHTML = ICONOS.listo;
        toast('Código ' + c + ' copiado');
        setTimeout(function(){
          cod.classList.remove('copiado');
          var ic2 = cod.querySelector('.codigo svg'); if(ic2) ic2.outerHTML = ICONOS.copiar;
        }, 1800);
      });
    }
  });

  document.getElementById('btn-compartir').addEventListener('click', function(){
    var datos = {title: document.title, text: PERFIL.nombre + ' · ' + (PERFIL.descripcion || ''), url: location.href};
    if(navigator.share){ navigator.share(datos).catch(function(){}); }
    else { copiar(location.href).then(function(){ toast('Enlace copiado'); }); }
  });
})();
</script>
</body>
</html>
